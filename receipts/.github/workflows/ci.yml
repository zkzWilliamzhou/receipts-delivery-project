name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Full suite
        run: python3 -m unittest discover -s tests -v
      - name: Offline demo
        run: python3 -m receipts demo
      - name: Ledger self-check
        run: python3 -m receipts init && python3 -m receipts doctor
